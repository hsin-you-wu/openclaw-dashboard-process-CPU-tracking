<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process Monitoring - WebSocket Stream</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0f;
      color: #e4e4e7;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      margin-bottom: 20px;
      color: #6366f1;
    }
    
    .connection-status {
      padding: 10px 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    
    .connected {
      background: #10b981;
      color: white;
    }
    
    .disconnected {
      background: #ef4444;
      color: white;
    }
    
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .metric-card {
      background: #1f1f2e;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 20px;
    }
    
    .metric-title {
      font-size: 14px;
      color: #a1a1aa;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    
    .metric-value {
      font-size: 32px;
      color: #6366f1;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .metric-detail {
      font-size: 12px;
      color: #71717a;
    }
    
    .json-stream {
      background: #13131a;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
      font-size: 12px;
    }
    
    .json-line {
      padding: 5px 0;
      border-bottom: 1px solid #2a2a3a;
      color: #06b6d4;
    }
    
    .json-line:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔴 Live Process Monitoring (WebSocket Stream)</h1>
    
    <div id="status" class="connection-status disconnected">
      Status: Connecting...
    </div>
    
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">CPU Usage</div>
        <div class="metric-value" id="cpu-value">--</div>
        <div class="metric-detail" id="cpu-detail">--</div>
      </div>
      
      <div class="metric-card">
        <div class="metric-title">Memory Usage</div>
        <div class="metric-value" id="mem-value">--</div>
        <div class="metric-detail" id="mem-detail">--</div>
      </div>
      
      <div class="metric-card">
        <div class="metric-title">System Info</div>
        <div class="metric-detail" id="system-info">--</div>
      </div>
    </div>
    
    <h2 style="margin-top: 30px; margin-bottom: 15px; color: #a1a1aa;">Raw JSON Stream</h2>
    <div class="json-stream" id="json-stream">
      <div class="json-line">Waiting for data...</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const cpuValueEl = document.getElementById('cpu-value');
    const cpuDetailEl = document.getElementById('cpu-detail');
    const memValueEl = document.getElementById('mem-value');
    const memDetailEl = document.getElementById('mem-detail');
    const systemInfoEl = document.getElementById('system-info');
    const jsonStreamEl = document.getElementById('json-stream');
    let jsonLines = [];

    function updateStatus(connected) {
      statusEl.className = 'connection-status ' + (connected ? 'connected' : 'disconnected');
      statusEl.textContent = 'Status: ' + (connected ? '✓ Connected' : '✗ Disconnected');
    }

    function addJsonLine(data) {
      jsonLines.unshift(data);
      if (jsonLines.length > 20) jsonLines.pop();
      
      jsonStreamEl.innerHTML = jsonLines
        .map(line => `<div class="json-line">${escapeHtml(line)}</div>`)
        .join('');
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket('ws://localhost:7000');

      ws.onopen = () => {
        updateStatus(true);
        console.log('WebSocket connected');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const json = JSON.stringify(data, null, 2);
          addJsonLine(json);

          // Update metric displays
          cpuValueEl.textContent = data.cpu.percent.toFixed(1) + '%';
          cpuDetailEl.textContent = `${data.cpu.cores} cores • ${data.cpu.model}`;

          memValueEl.textContent = data.memory.percent.toFixed(1) + '%';
          const memGb = (data.memory.used / 1024 / 1024 / 1024).toFixed(2);
          memDetailEl.textContent = `${memGb} GB / ${(data.memory.total / 1024 / 1024 / 1024).toFixed(2)} GB`;

          systemInfoEl.textContent = `Platform: ${data.platform} • Uptime: ${Math.floor(data.uptime / 3600)}h`;
        } catch (e) {
          console.error('Failed to parse JSON:', e);
        }
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        updateStatus(false);
      };

      ws.onclose = () => {
        updateStatus(false);
        console.log('WebSocket disconnected, reconnecting in 3 seconds...');
        setTimeout(connectWebSocket, 3000);
      };
    }

    connectWebSocket();
  </script>
</body>
</html>
